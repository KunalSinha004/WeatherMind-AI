version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/weathermind
      - FASTAPI_AI_URL=http://ai-service:8000
      - JWT_SECRET=weathermind_ai_production_secret_key_2026
    depends_on:
      - mongodb
      - ai-service

  ai-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai-service
    ports:
      - "8000:8000"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
